<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loïc | Présentation</title>

    <style>
        /* Style général de la page */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #a41b1b;
            color: #222222;
        }

        /* Bloc principal */
        main {
            width: 90%;
            max-width: 700px;
            margin: 60px auto;
            padding: 40px;
            box-sizing: border-box;
            background-color: white;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
            font-size: 42px;
        }

        h2 {
            margin-top: 35px;
            font-size: 24px;
        }

        p {
            line-height: 1.6;
        }

        ul {
            padding-left: 20px;
            line-height: 1.8;
        }

        /* Style du lien GitHub */
        a {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 20px;
            background-color: #222222;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        a:hover {
            background-color: #444444;
        }

        @media (max-width: 600px) {
            main {
                margin: 20px auto;
                padding: 25px;
            }

            h1 {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

    <main>
        <h1>Bonjour, je suis Loïc.</h1>

        <p>Étudiant en médiamatique depuis 2025.</p>

        <h2>Mes compétences et centres d'intérêt</h2>

        <ul>
            <li>Sécurité</li>
            <li>Interface utilisateur</li>
            <li>Animation web</li>
        </ul>

        <h2>Mon GitHub</h2>

        <p>
            Vous pouvez consulter mes projets et mon travail sur GitHub.
        </p>

        <a href="https://github.com/TheBalaboo/M291-Loic" target="_blank">
            Voir mon GitHub
        </a>
    </main>

</body>
</html>
